
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHA: Cat Life!</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #202b35;
      color: white;
      font-family: monospace;
      text-align: center;
    }

    h1 { margin: 16px 8px 6px; }
    p { margin: 8px; }

    #game {
      display: block;
      width: 100%;
      max-width: 640px;
      height: auto;
      margin: 16px auto;
      border: 4px solid #f5e6b8;
      background: #8acb75;
      image-rendering: pixelated;
      touch-action: manipulation;
    }

    button {
      font: bold 16px monospace;
      padding: 12px 18px;
      margin: 5px;
      border: 3px solid #f5e6b8;
      border-radius: 8px;
      background: #3c6e47;
      color: white;
    }
  </style>
</head>
<body>
  <h1>🐾 MHA: CAT LIFE!</h1>
  <p>Welcome to the kitty hero world!</p>

  <canvas id="game" width="640" height="480"></canvas>

  <button id="pause">⏸ Pause</button>
  <button id="add">🐱 Add a cat</button>
  <p id="status">Your cats are exploring!</p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    const cats = [
      { x: 150, y: 140, color: "#374151", speed: 1.1, face: "😺" },
      { x: 350, y: 260, color: "#f0c75e", speed: 0.9, face: "🐱" },
      { x: 480, y: 150, color: "#e7e7e7", speed: 1.3, face: "😸" }
    ];

    let paused = false;
    let lastTime = 0;

    function makeCat() {
      return {
        x: 40 + Math.random() * 560,
        y: 50 + Math.random() * 380,
        color: ["#374151", "#f0c75e", "#e7e7e7",
                "#d78b58", "#c5a3e8"][Math.floor(Math.random() * 5)],
        speed: 0.7 + Math.random() * 1.0,
        face: "🐱",
        dx: 0,
        dy: 0,
        turn: 0
      };
    }

    cats.forEach(cat => {
      cat.dx = Math.random() - 0.5;
      cat.dy = Math.random() - 0.5;
      cat.turn = Math.random() * 100;
    });

    function drawCat(cat) {
      ctx.font = "30px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(cat.face, cat.x, cat.y);
    }

    function drawWorld() {
      ctx.fillStyle = "#8acb75";
      ctx.fillRect(0, 0, 640, 480);

      ctx.fillStyle = "#a8d98d";
      for (let x = 20; x < 640; x += 80) {
        for (let y = 20; y < 480; y += 80) {
          ctx.fillRect(x, y, 3, 3);
          ctx.fillRect(x + 15, y + 12, 3, 3);
        }
      }

      ctx.fillStyle = "#d8c49a";
      ctx.fillRect(0, 390, 640, 55);

      ctx.fillStyle = "#5a9e58";
      ctx.fillRect(0, 386, 640, 5);
    }

    function update(delta) {
      cats.forEach(cat => {
        cat.turn -= delta;

        if (cat.turn <= 0) {
          cat.dx = Math.random() * 2 - 1;
          cat.dy = Math.random() * 2 - 1;
          cat.turn = 40 + Math.random() * 100;
        }

        const length = Math.hypot(cat.dx, cat.dy) || 1;
        cat.x += (cat.dx / length) * cat.speed * delta;
        cat.y += (cat.dy / length) * cat.speed * delta;

        if (cat.x < 20 || cat.x > 620) cat.dx *= -1;
        if (cat.y < 30 || cat.y > 460) cat.dy *= -1;

        cat.x = Math.max(20, Math.min(620, cat.x));
        cat.y = Math.max(30, Math.min(460, cat.y));
      });
    }

    function frame(time) {
      const delta = Math.min((time - lastTime) / 16.67 || 1, 2);
      lastTime = time;

      if (!paused) update(delta);

      drawWorld();
      cats.forEach(drawCat);
      requestAnimationFrame(frame);
    }

    document.getElementById("pause").onclick = () => {
      paused = !paused;
      document.getElementById("pause").textContent =
        paused ? "▶ Resume" : "⏸ Pause";
      status.textContent = paused
        ? "The kitties are taking a nap!"
        : "Your cats are exploring!";
    };

    document.getElementById("add").onclick = () => {
      cats.push(makeCat());
      status.textContent = `There are ${cats.length} cats in the playground!`;
    };

    requestAnimationFrame(frame);
  </script>
</body>
</html>
